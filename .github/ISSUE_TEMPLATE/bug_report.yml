name: 🐞 Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Gmail panel (add-on)
        - Editor – Paste HTML
        - Editor – Build with blocks
        - Customise
        - Preview
        - Sent email
        - Setup / deploy
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or template code
      description: Please remove any private data first.
