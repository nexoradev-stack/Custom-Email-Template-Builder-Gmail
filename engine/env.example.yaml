# Copy this file to env.yaml and fill it in. env.yaml is never committed.
# Used by:  gcloud run deploy ... --env-vars-file env.yaml

# ---- Google Cloud ----
PROJECT_NUMBER: "123456789012"          # Google Cloud project number (not the id)
OAUTH_CLIENT_ID: "1234567890-abc.apps.googleusercontent.com"   # the add-on's OAuth client (see docs/setup.md)
IMAGE_BUCKET: "your-image-bucket"       # public-read Cloud Storage bucket for the image library
FIRESTORE_DB: "templates"               # Firestore database id

# ---- Who can use it ----
ALLOWED_DOMAIN: "example.com"           # only accounts on this Google Workspace domain
ADMIN_GROUP: "template-admins@example.com"   # Google Group whose members can build and publish
# Optional safety net if the group check cannot be reached (comma separated):
# ADMIN_EMAILS: "alex@example.com,sam@example.com"

# ---- Your brand (all optional) ----
APP_NAME: "Template Gallery"
BRAND_NAME: "Acme"                      # used in new header and footer rows
BRAND_WEBSITE: "https://www.example.com"
BRAND_LOGO_URL: "/assets/logo-mark.png" # small square logo in the editor's top band
BRAND_INK: "#17123B"                    # dark colour: top band, text, header rows
BRAND_ACCENT: "#6C3BFF"                 # buttons, links, selection
BRAND_SOFT: "#EDE8FF"                   # footer rows
BRAND_PAGE: "#F8F7FC"                   # page background
